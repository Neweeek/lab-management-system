<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成员功能验收（模拟数据）</title><div id="qa"></div><script type="module">
import {createApp,ref} from 'vue';import Members from '/src/member-admin.ts';import Projects from '/src/projects.ts';import '/src/style.css';import '/src/sidebar.css';import '/src/spacious-workspace.css';
let users=[{id:1,name:'管理员',student_no:'admin',role:'ADMIN',approved:1,member_status:'ACTIVE',created_at:'2026-09-01'},{id:2,name:'王同学',student_no:'20260001',role:'MEMBER',approved:0,member_status:'UNCONFIRMED',created_at:'2026-09-10 08:30'},{id:3,name:'李同学',student_no:'20260002',role:'MEMBER',approved:0,member_status:'UNCONFIRMED',created_at:'2026-09-10 09:30'}];
const request=async(path,options)=>{if(options){if(path.includes('batch-approve')){const ids=JSON.parse(options.body).ids;users=users.map(u=>ids.includes(u.id)?{...u,approved:1,member_status:'MOBILE'}:u);}if(path.endsWith('/delete'))users=users.filter(u=>u.id!==Number(path.split('/')[3]));return{message:'模拟操作成功'};}if(path.endsWith('delete-preview'))return{user:users.find(u=>u.id===Number(path.split('/')[3])),seats:0,bookings:0,teams:0,ownedProjects:0,reports:2};if(path==='/admin/registrations')return users.filter(u=>u.approved===0);if(path==='/admin/members')return users;return{items:[{id:1,name:'智能车竞赛学生招募',type:'COMPETITION',status:'RECRUITING',capacity:5,member_count:1,description:'寻找嵌入式与视觉算法方向的同学，一起完成智能车系统。',deadline:'2030-12-01',created_at:'2026-09-10 01:30:00',creator_name:'学生发布者'}],total:1};};
createApp({components:{Members,Projects},setup(){return{tab:ref('members'),request,users,admin:{id:1,name:'管理员',role:'ADMIN'},student:{id:4,name:'学生发布者',role:'MEMBER',approved:1,member_status:'MOBILE'}};},template:`<main><header class="topbar"><b>实验室管理系统</b><span>本地模拟数据</span></header><div class="workspace"><aside class="sidebar"><button @click="tab='members'">管理员成员管理</button><button @click="tab='projects'">学生发布竞赛</button></aside><div class="content"><Members v-if="tab==='members'" :request="request" :user="admin"/><Projects v-else :request="request" :user="student" :members="[]"/></div></div></main>`}).mount('#qa');
</script></html>
