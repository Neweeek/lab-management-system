server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}
      cookie:
        name: LABSESSION
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  application:
    name: lab-seat-system
  datasource:
    url: jdbc:sqlite:${APP_DB_PATH:../database/lab.db}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:4}
      minimum-idle: 1
      connection-timeout: 10000
      # 注意：这里刻意不使用 connection-init-sql。实测 sqlite-jdbc 对
      # "PRAGMA a=1; PRAGMA b=2" 这样的多语句只执行第一条，会让 foreign_keys 静默失效。
      # PRAGMA 改由 com.lab.seat.SqlitePragmaConfig 在每次取连接时逐条执行。
  # 数据库结构由 com.lab.seat.migration.MigrationRunner 管理（见 db/migration/*.sql）。
  # 不再使用 spring.sql.init，因为它既不记录版本，也无法在已有库上新增列。
  jackson:
    # Java 侧时间统一由 LabTime 以 Asia/Shanghai 生成；这里保持一致，
    # 避免将来引入 Date/Instant 字段时出现第二个时区基准。
    time-zone: Asia/Shanghai
app:
  # 允许的前端来源，逗号分隔，支持 Spring 的 origin pattern 通配。
  #
  # 默认值刻意用 "本机任意端口" 而不是写死 5173/5175：
  # 本地开发时 Vite 端口经常因占用而漂移（5173 → 5174 → 5175…），
  # 而且浏览器把 http://localhost:5173 与 http://127.0.0.1:5173 视为**不同来源**，
  # 写死端口列表会反复以 "Invalid CORS request" 的形式踩坑。
  #
  # 生产环境由 docker-compose 显式设置 APP_CORS_ORIGINS=https://<域名>，
  # 不会走到这个默认值，因此放宽默认值不影响线上安全边界。
  cors-origins: ${APP_CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  bootstrap:
    admin-student-no: ${APP_BOOTSTRAP_ADMIN_STUDENT_NO:}
    admin-name: ${APP_BOOTSTRAP_ADMIN_NAME:系统管理员}
    admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
